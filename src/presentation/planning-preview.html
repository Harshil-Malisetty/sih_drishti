<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drishti · 3D-style planning preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #142c2b; color: #f5efd9; font-family: 'DM Sans', sans-serif; }
      main { min-height: 100svh; display: grid; align-content: center; gap: 20px; padding: 24px; max-width: 1600px; margin: auto; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      h1 { font-size: 20px; margin: 0; font-weight: 500; }
      header p { font-size: 12px; color: #b7ccbc; margin: 0; }
      .stage { background: #f5efd9; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px #051a1a55; }
      svg { display: block; width: 100%; max-height: 74svh; }
      footer { display: flex; align-items: center; gap: 16px; }
      button { border: 1px solid #5c7c6e; border-radius: 24px; padding: 10px 20px; background: #254b42; color: inherit; font: inherit; cursor: pointer; min-width: 100px; }
      button:hover { background: #376556; }
      button:focus-visible, input:focus-visible { outline: 3px solid #e5c781; outline-offset: 4px; }
      label { flex: 1; display: flex; align-items: center; gap: 16px; font-size: 13px; }
      input { flex: 1; min-width: 0; accent-color: #b6d7af; }
      output { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 90px; text-align: right; }
      @media (max-width: 600px) { main { padding: 12px; gap: 16px; } header { align-items: start; flex-direction: column; } footer { gap: 8px; } label span { display: none; } button { padding: 10px 12px; min-width: 76px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./PlanningPreview.tsx"></script>
  </body>
</html>
